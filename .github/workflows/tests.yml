name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # No camera, speaker or Piper needed: the tests fake them
      - run: pip install numpy flask pillow onnxruntime
      - run: python -m unittest -v
