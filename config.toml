# Startup defaults. Values changed on the web page are saved to settings.json
# and override these. Delete settings.json to go back to these defaults.

[speaker]
# Bluetooth MAC of the speaker, e.g. "AA:BB:CC:DD:EE:FF". Leave empty to just
# play on whatever the default audio output is. Set it in config.local.toml
# (not in git), which overrides this file section by section.
mac = ""
volume = 0.9                # scare sounds and voice, 0.0 - 1.5
ambient_volume = 0.25       # background loop, 0 = off

[motion]
start_armed = true
pixel_threshold = 25        # how much a pixel must change (0-255) to count
area_percent = 1.5          # % of the picture that must change to trigger
frames_required = 3         # consecutive frames of motion (filters flicker)
cooldown_seconds = 20       # minimum time between scares

[voice]
# Default Piper neural voice (Norwegian Bokmål), downloaded by setup.sh.
# A mode can set its own `model` (and so its own language).
model = "voices/no_NO-talesyntese-medium.onnx"

# Each mode has its own folder in modes/<name>/ with messages.txt, scare/
# (played before each message) and ambient/ (quiet background loop).
# `effects` are sox effects for the voice; empty string = natural voice.
# Optional Piper settings per mode:
#   length_scale      speaking speed, >1 = slower (1.0 = normal). Much more
#                     natural than slowing down with sox `tempo`.
#   sentence_silence  seconds of pause between sentences
#   noise_scale       voice variation (default 0.667), higher = rougher, more uneven
#   noise_w           rhythm variation (default 0.8), higher = more irregular pacing
[modes]
default = "scary"

[modes.scary]
label = "Skummel"
# English (British) voice; the messages in modes/scary are in English
model = "voices/en_GB-alan-medium.onnx"
# angry old troll: lower, gravelly, trembling, uneven pacing
effects = "gain -8 rate 44100 pitch -180 overdrive 14 tremolo 5 20 reverb 40 echo 0.8 0.7 90 0.25 gain -n -3"
length_scale = 1.2
sentence_silence = 0.4
noise_scale = 0.85
noise_w = 1.0

[modes.kids]
label = "Barnevennlig"
# friendly ghost: deeper, trembling, big room and echo; the messages stay nice
effects = "gain -6 rate 44100 pitch -400 tremolo 4 25 reverb 60 echo 0.8 0.7 150 0.35 gain -n -3"
length_scale = 1.3
sentence_silence = 0.4

# Auto mode: per scare, picks kid_mode if anyone looks shorter than
# kid_height_cm (or if nobody is seen clearly), otherwise adult_mode.
# Needs calibrating on the web page: a person of known height on the doormat,
# then a second spot 2-3 m further away (calibration is saved in settings.json).
[auto]
# Person detector, downloaded by setup.sh. YOLO26n (AGPL-3.0, better heights);
# YOLOX-nano (Apache-2.0, a bit faster) is used if the first file is missing.
model = "models/yolo26n-416.onnx"
fallback_model = "models/yolox_nano.onnx"
kid_mode = "kids"
adult_mode = "scary"
kid_height_cm = 130
look_seconds = 1.5          # how long to look at the visitors before deciding
# After a scary scare the background sound and lights stay scary this long (each scare
# still checks the visitors first; a kid result switches back at once)
scary_hold_seconds = 180

[camera]
width = 640
height = 480
fps = 15
# libcamera colour profile, e.g. "ov5647_noir.json" for a NoIR camera (no infrared filter,
# pink pictures in daylight). Empty = the default for the sensor.
tuning = ""
# Brightness in the dark: auto exposure may use up to max_exposure_ms per frame (the frame
# rate drops below fps to match, which is fine for motion), and ev brightens the picture
# (+1 = twice as bright, 0 = normal). Longer exposure blurs people who move fast.
# max_gain amplifies the signal further when that's not enough (grainier picture).
max_exposure_ms = 66
max_gain = 32
ev = 0.0

[web]
host = "0.0.0.0"
port = 8000

# Philips Hue light show (add-on, off unless enabled = true): slow spooky colours
# while the background sound plays, lights that follow the scare sound and the
# voice (white flashes in the scary mode, at most 3 a second; the kid mode never
# flashes). Lamps go back to how they were when the sound stops. Pair once with
# `.venv/bin/python -m scare.lights pair` and put enabled, bridge, key and lights
# in config.local.toml.
[lights]
enabled = false             # true = load the light show add-on
bridge = ""                 # IP address of the Hue Bridge
key = ""                    # app key from pairing
lights = []                 # lamp ids, e.g. ["3", "4"]: see `python -m scare.lights list`
start_on = true             # can be switched on the web page
brightness = 1.0            # 0.05 - 1.0, scales every effect
delay_ms = 200              # Bluetooth speakers play late; the lights wait this long to match
